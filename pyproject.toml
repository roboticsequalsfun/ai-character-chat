[project]
name = "ai_chat_project"
version = "0.1.0"

dependencies = [
   "deepgram-sdk",
   "whisper",
   "pydub",
   "tqdm",
   "sounddevice",
   "librosa",
   "simpleaudio",
   "llama-cpp-python",
    "torch",
    "torchaudio",
   "wavio"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["character_chat*"]
