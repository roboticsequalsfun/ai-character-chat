[project]
name = "ai_chat_project"
version = "0.1.0"
dependencies = [
    "tqdm",
]

[project.optional-dependencies]

llm = [
    "llama-cpp-python"
]

stt = [
    "openai-whisper",
    "librosa",
    "deepgram-sdk",
    "pydub"
]

tts = [
    "TTS",
    "pydub",
    "scipy"
]

audio = [
    "numpy",
    "soundfile",
    "sounddevice"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["character_chat*"]
